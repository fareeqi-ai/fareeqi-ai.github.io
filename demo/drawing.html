<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرسام</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;900&family=Aref+Ruqaa:wght@700&family=El+Messiri:wght@600&display=swap" rel="stylesheet">
<style>

button.main{background:#FFD43B}

</style></head><body>
<div class="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="bar"><button id="replay">إعادة</button><button id="rec" class="main">نزّل الفيديو</button></div>
  <div id="msg"></div>
</div>
<script>
// =====================================================================
// الإعدادات: غيّر الكلام والألوان هني بس
// =====================================================================
const CONFIG = {
  title: 'بيتنا',                // العنوان اللي ينكتب بالقلم بالنهاية
  seconds: 4.5,
  fileName: 'drawing',
  fonts: ['700 190px "Aref Ruqaa"'],

// =====================================================================
// أدوات عامة (لا تغيرها)
// =====================================================================
const W = 1080, H = 1920, cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));                       // 0 → 1 between seconds a and b
const ease = {

  inOut: u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; },
  back: (u, s = 1.7) => { u = clamp(u) - 1; return 1 + (s + 1) * u * u * u + s * u * u; },
};
function rand(seed) { let a = seed >>> 0; return () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296; }
function write(s, x, y, { size = 100, font = 'Alexandria', weight = 900, color = '#fff', alpha = 1 } = {}) {
  if (alpha <= 0) return; c.save(); c.globalAlpha *= alpha; c.font = `${weight} ${size}px "${font}"`;
  c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y); c.restore();
}
function star(x, y, r, color, rot = 0, points = 4) {
  c.save(); c.translate(x, y); c.rotate(rot); c.beginPath();
  for (let i = 0; i < points * 2; i++) { const a = i * Math.PI / points - Math.PI / 2, rr = i % 2 ? r * 0.26 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = color; c.fill(); c.restore();
}
const noise = document.createElement('canvas'); noise.width = noise.height = 256;
{ const g = noise.getContext('2d'), img = g.createImageData(256, 256), r = rand(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 22; } g.putImageData(img, 0, 0); }
function filmLook(t, dark = 0.5) {                                        // grain + vignette, same on every scene
  c.save(); c.globalCompositeOperation = 'overlay'; const o = (Math.floor(t * 24) * 37) % 256;
  c.fillStyle = c.createPattern(noise, 'repeat'); c.translate(-o, -o); c.fillRect(0, 0, W + 256, H + 256); c.restore();
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${dark})`); c.fillStyle = v; c.fillRect(0, 0, W, H);
}
function flash(t, at, strength = 0.4, color = '255,255,255') {
  const a = Math.max(0, 1 - Math.abs(t - at) / 0.1) * strength; if (a) { c.fillStyle = `rgba(${color},${a})`; c.fillRect(0, 0, W, H); }
}

// =====================================================================
// المشهد: كل إطار يعتمد على الوقت t بالثواني بس
// =====================================================================
// ===== محرك الرسم: حبر يرسم نفسه، وألوان مائية، وورق، وقلم =====
const Ink = (() => {
// Hand-drawn storybook engine (our own code): warm paper, a wobbly pen ribbon that draws itself,
// watercolour washes that bloom in slightly off the line, and a pencil that follows the ink tip.
// Everything is a pure function of time; randomness is seeded.
const PAPER = '#F4EDE0', INK = '#26211E', RED = '#C0392B';

const hash = n => { n = (n << 13) ^ n; return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824; };

const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = u => 1 - Math.pow(1 - clamp01(u), 3);

// ---------- shapes as point lists ----------

const line = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];

// ---------- watercolour ----------
const bakes = new Map();

  const pad = 24, cv = document.createElement('canvas'); cv.width = Math.ceil(x1 - x0 + pad * 2); cv.height = Math.ceil(y1 - y0 + pad * 2);
  const g = cv.getContext('2d'), r = rng(seed); g.translate(pad - x0, pad - y0); g.fillStyle = color;

// Blooms a wash in from point `from` (a wobbly growing circle) between t0 and t0 + dur.

let paperCv;

      gr.addColorStop(0, `rgba(${r() < 0.5 ? '214,196,166' : '255,250,240'},${0.04 + r() * 0.04})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }

// ---------- words on paper ----------
function say(c, words, t, x, y, { size = 64, font = 'El Messiri', weight = 600, color = INK, key = '', keyColor = RED, maxW = 940 } = {}) {
  c.save(); c.font = `${weight} ${size}px "${font}"`; c.direction = 'rtl'; c.textBaseline = 'middle';
  const sp = size * 0.28, ws = words.map(o => ({ ...o, wd: c.measureText(o.w).width })); let total = ws.reduce((a, o) => a + o.wd + sp, -sp);

    let acc = 0, cut = 1; for (let i = 0; i < ws.length; i++) { acc += ws[i].wd + sp; if (acc > total / 2) { cut = Math.max(1, i); break; } }
    c.restore(); const o = arguments[5] || {}; say(c, words.slice(0, cut), t, x, y - size * 0.62, { ...o, row: 1 }); say(c, words.slice(cut), t, x, y + size * 0.62, { ...o, row: 1 }); return;

// Mountain ridge by midpoint displacement.

})();
const { PAPER, INK, RED, noise: inkNoise, rng, easeOut, easeInOut, line, arc, ring, bez, wavy, lobed, pen, wash, softWash, ridge, under, paper, pencil } = Ink;
// ===== المشهد: أجزاء من ورا لقدام. كل جزء: ورق تحته، وألوانه، وخطوطه =====
const rect = (x0, y0, x1, y1) => [[x0, y1], [x0, y0], [x1, y0], [x1, y1], [x0, y1]];

// A scene is a list of parts, back to front. Each part: { L: layer, under, washes, strokes, mv }.
// Strokes carry their own time (s, d); the pencil rides the newest stroke being drawn.

    for (const w of P.washes || []) w.soft ? softWash(c, w.key, w.blobs, w.col, lt, w.t0, w.dur || 0.8, w.from || S.from) : wash(c, w.key, w.p, w.col, lt, w.t0, w.dur || 0.8, w.from || S.from, w.seed || 5);
    for (const s of P.strokes || []) { const p = easeInOut(Ink.seg(lt, s.s, s.s + s.d)); last = Math.max(last, s.s + s.d);
      const at = pen(c, s.p, p, { w: s.w || 3.4, seed: s.seed || 1, boil: P.boil ? Math.floor(t * 8) : 0, alpha: s.a || 1 });
      if (p > 0 && p < 1 && (!tip || s.s > tip.s)) tip = { s: s.s, at: P.mv ? [at[0] + mv[0], at[1] + mv[1]] : at }; }
    c.restore();
  }
  S.life?.(c, lt, t, mv);
  if (tip) S._tip = tip.at; const pt = tip?.at || S._tip || [540, 1000];
  pencil(c, pt[0], pt[1], t, 1 - Ink.seg(lt, last, last + 0.3));
}
// Give every stroke in draw order a start and a length; several overlap so the page fills fast.
function schedule(S, a, b, order) {
  const all = []; for (const P of S.parts) for (const s of P.strokes || []) all.push(s);
  const list = order ? order(all) : all, n = list.length, d = (b - a) / n * 2.4;
  list.forEach((s, i) => { s.s = a + (b - a) * i / n; s.d = s.d || Math.min(0.7, d); });
  return S;
}

// ---------- A · full-bleed meadow (the hook) ----------
const MEADOW = bez([-20, 1080], [300, 1010], [700, 1090], [1100, 1030]);
const MTN = ridge(-40, 1120, 900, 260, 7);
const HILLS = bez([-20, 1010], [250, 930], [520, 960], [700, 990], [860, 1010], [980, 960], [1100, 975]);
const TREELINE = []; for (let x = 560; x < 1100; x += 34) TREELINE.push(...arc(x + 17, 975 - (x - 560) * 0.02 + inkNoise(x, 6) * 6, 17, 20 + inkNoise(x * 0.3, 2) * 6, Math.PI, Math.PI * 2, 8));
const TRUNK = poly([142, 1130], [160, 1100], [166, 900], [172, 760], [196, 760], [200, 900], [206, 1100], [226, 1130]);
const CROWNS = [[118, 720, 105, 5], [258, 690, 96, 9], [185, 590, 100, 13]];
const HOUSE = { wall: rect(640, 930, 850, 1100), roof: poly([615, 938], [745, 820], [875, 938]), door: rect(718, 1010, 772, 1100), win: rect(662, 960, 704, 1000), chim: poly([800, 905], [800, 840], [830, 840], [830, 925]) };
const PATH = [...bez([718, 1100], [690, 1300], [600, 1500], [520, 1920]), ...bez([840, 1920], [800, 1500], [790, 1300], [772, 1100])];
const flowers = [], grass = []; { const r = rng(12); for (let i = 0; i < 26; i++) flowers.push([40 + r() * 1000, 1180 + r() * 300, r() < 0.5 ? '#D9534F' : '#F2C14E']); for (let x = 20; x < 1080; x += 30) grass.push([[x, 1072 - (x > 700 ? (x - 700) * 0.1 : 0) + inkNoise(x, 3) * 8], [x - 5, 1050 - (x > 700 ? (x - 700) * 0.1 : 0) + inkNoise(x, 3) * 8]]); }
const A = schedule({ from: [540, 200],
  parts: [
    { washes: [{ soft: 1, key: 'A-sky1', blobs: [[540, 80, 1000, 260, 0.9], [100, 300, 600, 200, 0.6], [980, 320, 600, 200, 0.6]], col: '#5F84C9', t0: 2.0, dur: 1.2, from: [540, 0] },
               { soft: 1, key: 'A-sky2', blobs: [[540, 560, 1100, 260, 0.55], [300, 760, 700, 160, 0.4], [860, 740, 700, 160, 0.4]], col: '#A9C4E8', t0: 2.1, dur: 1.2, from: [540, 300] }] },
    { under: ring(810, 410, 80), washes: [{ key: 'A-sun', p: ring(810, 410, 80), col: '#F6C945', t0: 2.0, dur: 0.5, from: [810, 410] }],
      strokes: [{ p: ring(810, 410, 80) }, ...Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return { p: line(810 + Math.cos(a) * 104, 410 + Math.sin(a) * 104, 810 + Math.cos(a) * 140, 410 + Math.sin(a) * 140), w: 3, d: 0.15 }; })] },
    { under: cloud(90, 560, 1.1), washes: [{ key: 'A-c1', p: cloud(90, 560, 1.1), col: '#EEF3FA', t0: 2.3, dur: 0.5, from: [160, 540] }], strokes: [{ p: cloud(90, 560, 1.1) }] },
    { under: cloud(480, 300, 0.8), washes: [{ key: 'A-c2', p: cloud(480, 300, 0.8), col: '#EEF3FA', t0: 2.3, dur: 0.5, from: [540, 290] }], strokes: [{ p: cloud(480, 300, 0.8) }] },
    { under: [...MTN, [1120, 1100], [-40, 1100]], washes: [{ key: 'A-mtn', p: [...MTN, [1120, 1100], [-40, 1100]], col: '#8FA6C9', t0: 2.3, dur: 0.9, from: [540, 800] }], strokes: [{ p: MTN, w: 2.8 }] },
    { under: [...HILLS, [1100, 1150], [-20, 1150]], washes: [{ key: 'A-hills', p: [...HILLS, [1100, 1150], [-20, 1150]], col: '#5F9A6E', t0: 2.45, dur: 0.8, from: [700, 1000] },
      { key: 'A-tl', p: [...TREELINE, [1100, 1010], [560, 1010]], col: '#3F7A55', t0: 2.5, dur: 0.6, from: [820, 960] }], strokes: [{ p: HILLS }, { p: TREELINE, w: 2.6 }] },
    { under: [...MEADOW, [1100, 1940], [-20, 1940]], washes: [{ key: 'A-meadow', p: [...MEADOW, [1100, 1940], [-20, 1940]], col: '#86B86A', t0: 2.55, dur: 0.9, from: [540, 1300] },
      { soft: 1, key: 'A-mlow', blobs: [[540, 1700, 1100, 300, 0.5], [200, 1400, 500, 160, 0.3]], col: '#5E9450', t0: 2.7, dur: 0.8, from: [540, 1800] },
      { key: 'A-path', p: PATH, col: '#E6CFA0', t0: 2.8, dur: 0.6, from: [745, 1150] }],
      strokes: [{ p: MEADOW }, { p: PATH.slice(0, 25), w: 2.8 }, { p: PATH.slice(25), w: 2.8 }, ...grass.map(g => ({ p: g, w: 2.4, d: 0.12 }))] },
    { under: TRUNK, washes: [{ key: 'A-trunk', p: TRUNK, col: '#8A5A33', t0: 2.6, dur: 0.5, from: [184, 1000] }],
      strokes: [{ p: TRUNK.slice(0, 4) }, { p: TRUNK.slice(4) }, { p: bez([180, 1080], [178, 1030], [184, 990], [182, 950]), w: 2.2 }] },
    ...CROWNS.map(([x, y, r, sd], i) => ({ under: lobed(x, y, r, 6, 0.16, sd), washes: [{ key: 'A-cr' + i, p: lobed(x, y, r, 6, 0.16, sd), col: ['#5E9E46', '#6FAE52', '#4F8E3E'][i], t0: 2.65 + i * 0.05, dur: 0.5, from: [x, y] }],
      strokes: [{ p: lobed(x, y, r, 6, 0.16, sd) }, { p: arc(x + 10, y + 10, r * 0.55, r * 0.45, 0.3, 1.6, 12), w: 2.2 }, ...hatch(x, y, r, 6, sd).map(h => ({ p: h, w: 2, a: 0.6, d: 0.1 }))] })),
    { under: HOUSE.chim, washes: [{ key: 'A-chim', p: HOUSE.chim, col: '#B5653B', t0: 2.8, dur: 0.4, from: [815, 880] }], strokes: [{ p: HOUSE.chim }] },
    { under: HOUSE.wall, washes: [{ key: 'A-wall', p: HOUSE.wall, col: '#EAB07A', t0: 2.75, dur: 0.5, from: [745, 1010] }], strokes: [{ p: HOUSE.wall }] },
    { under: HOUSE.roof, washes: [{ key: 'A-roof', p: HOUSE.roof, col: '#C65A46', t0: 2.8, dur: 0.5, from: [745, 900] }], strokes: [{ p: HOUSE.roof }] },
    { washes: [{ key: 'A-door', p: HOUSE.door, col: '#7A5235', t0: 2.9, dur: 0.4, from: [745, 1050] }, { key: 'A-win', p: HOUSE.win, col: '#BFDDF0', t0: 2.9, dur: 0.4, from: [683, 980] }],
      strokes: [{ p: HOUSE.door }, { p: HOUSE.win }, { p: line(683, 960, 683, 1000), w: 2.4 }] },
    { under: lobed(470, 1110, 55, 5, 0.2, 21), washes: [{ key: 'A-bush', p: lobed(470, 1110, 55, 5, 0.2, 21), col: '#4F8E3E', t0: 2.9, dur: 0.4, from: [470, 1110] }], strokes: [{ p: lobed(470, 1110, 55, 5, 0.2, 21) }] },
  ],
  life(c, lt, t) {
    const a = Ink.seg(lt, 2.9, 3.3); if (a <= 0) return;
    for (const [x, y, col] of flowers) { const k = easeOut(Ink.seg(lt, 2.9 + (x / 1080) * 0.4, 3.1 + (x / 1080) * 0.4)); if (!k) continue;
      c.save(); c.globalAlpha = 0.85; c.fillStyle = col; c.beginPath(); c.arc(x, y, 7 * k, 0, 6.29); c.fill(); c.fillStyle = INK; c.beginPath(); c.arc(x, y, 2 * k, 0, 6.29); c.fill(); c.restore(); }
    for (let k = 0; k < 3; k++) { const ph = (lt * 0.5 + k / 3) % 1, y = 820 - ph * 180, x = 815 + Math.sin(ph * 8 + k) * 16;      // chimney smoke
      c.save(); c.globalAlpha = a * (1 - ph); pen(c, arc(x, y, 20 + ph * 18, 13 + ph * 9, 0, Math.PI * 1.6, 20), 1, { w: 2.4, seed: 9 + k, boil: Math.floor(t * 8) }); c.restore(); }
    for (let k = 0; k < 3; k++) { const bx = 1120 - (lt - 3.0) * 140 - k * 80, by = 560 + k * 36, f = Math.sin(t * 12 + k) * 12;                // birds
      c.save(); c.globalAlpha = a; pen(c, bez([bx - 24, by - f], [bx - 15, by - 11], [bx - 6, by - 6], [bx, by], [bx + 6, by - 6], [bx + 15, by - 11], [bx + 24, by - f]), 1, { w: 2.6, seed: 3 + k, boil: Math.floor(t * 8) }); c.restore(); }
  },
}, 0.05, 2.5, all => all.slice().sort((p, q) => (p.p[0][1] > 1050 ? 0 : 1) - (q.p[0][1] > 1050 ? 0 : 1)));


function draw(t) {
  paper(c, W, H);
  const z = 1.02 + 0.04 * easeInOut(t / 4.5); c.save(); c.translate(W / 2, H * 0.55); c.scale(z, z); c.translate(-W / 2, -H * 0.55);
  play(c, t, A, t); c.restore();
  const p = easeOut(Ink.seg(t, 3.4, 4.0)); if (p > 0) { c.save(); c.beginPath(); c.rect(W / 2 + 400 - 800 * p, 0, 800 * p, H); c.clip();
    c.font = '700 190px "Aref Ruqaa"'; c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 16; c.strokeStyle = PAPER; c.lineJoin = 'round';
    c.strokeText(CONFIG.title, W / 2, 1500); c.fillStyle = INK; c.fillText(CONFIG.title, W / 2, 1500); c.restore(); }
}

// =====================================================================
// التشغيل والتنزيل (لا تغيرها)
// =====================================================================
const DUR = CONFIG.seconds;
let start = performance.now(), recording = null;
function frame(now) {
  const t = Math.min(DUR, (now - start) / 1000);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.clearRect(0, 0, W, H); draw(t);
  if (t >= DUR) { if (recording) { recording.stop(); recording = null; } else if (now - start > (DUR + 0.8) * 1000) start = now; }
  requestAnimationFrame(frame);
}
document.getElementById('replay').onclick = () => { start = performance.now(); };
document.getElementById('rec').onclick = () => {
  const msg = document.getElementById('msg');
  if (!window.MediaRecorder || !cv.captureStream) { msg.textContent = 'المتصفح ما يدعم التنزيل. افتح الملف بكروم.'; return; }
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 }), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, { type }));
    a.download = CONFIG.fileName + (type.includes('mp4') ? '.mp4' : '.webm'); a.click(); msg.textContent = 'تم التنزيل'; };
  msg.textContent = 'جاري التسجيل…'; rec.start(); recording = rec; start = performance.now();
};
Promise.all([CONFIG.fonts.map(f => document.fonts.load(f))].flat()).finally(() => requestAnimationFrame(frame));
