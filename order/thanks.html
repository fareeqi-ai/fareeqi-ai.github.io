<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex">
<title>شكراً | فريقي</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3eee3;--ink:#1c1a17;--ink-soft:#5b554b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;
    background-image:radial-gradient(rgba(60,45,20,.05) 1px,transparent 1px);background-size:7px 7px}
  .box{max-width:420px;width:100%;text-align:center;background:#fbf8f1;border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);padding:34px 24px 28px}
  img{width:96px;height:96px;border-radius:22px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:block;margin:0 auto 20px}
  h1{font-family:"Amiri",serif;font-size:38px;line-height:1.4}
  p{font-size:16px;color:var(--ink-soft);margin-top:10px}
  a{display:block;margin-top:24px;padding:12px 16px;border:1.5px solid var(--ink);border-radius:3px;color:var(--ink);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <img src="img/logo.png" alt="فريقي">
    <h1>شكراً لك</h1>
    <p>وصلنا طلبك، وبيتم الرد عليك بأقرب وقت مع كافة التفاصيل.</p>
    <a href="./">رجوع للصفحة</a>
  </div>
</body>
</html>
